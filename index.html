<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ MASTER CM - Ultra Banger</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --text: #fff; --accent: #FFD700; --danger: #CE1126; --success: #007A5E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            display: flex; flex-direction: column; min-height: 100vh; padding: 20px;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Anton', sans-serif; font-size: 3.5rem; color: var(--accent); line-height: 1; }
        
        .game-container {
            max-width: 600px; margin: auto; width: 100%;
            background: #111; border: 4px solid var(--text);
            border-radius: 20px; padding: 30px;
            box-shadow: 12px 12px 0px var(--accent);
            position: relative;
        }

        /* --- UI ELEMENTS --- */
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; }
        .timer-bar { width: 100%; height: 15px; background: #222; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 2px solid #444; }
        #progress { width: 100%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

        .question-text { font-size: 1.5rem; font-weight: 700; margin-bottom: 25px; min-height: 80px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .option-btn {
            background: #222; border: 3px solid var(--text); color: white;
            padding: 15px; font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem;
            cursor: pointer; border-radius: 10px; transition: all 0.2s; text-align: left;
            box-shadow: 4px 4px 0px #444;
        }
        .option-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--accent); border-color: var(--accent); }
        .option-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }

        /* --- OVERLAYS --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 16px;
            z-index: 10; display: none; text-align: center; padding: 20px;
        }
        .btn-restart { 
            background: var(--success); color: white; border: none; padding: 15px 30px;
            font-family: 'Anton', sans-serif; font-size: 1.5rem; cursor: pointer; border-radius: 10px; margin-top: 20px;
        }

        footer { text-align: center; margin-top: 40px; font-size: 0.9rem; opacity: 0.7; }
        .dev-name { color: var(--accent); font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<header>
    <h1>QUIZ MASTER CM</h1>
    <p>Niveau de difficulté : <span id="difficulty-label" style="color: var(--accent)">NOVICE</span></p>
</header>

<div class="game-container">
    <div id="overlay">
        <h2 id="end-title" style="font-family: 'Anton'; font-size: 3rem; color: var(--danger);">GAME OVER</h2>
        <p id="end-reason">Temps écoulé !</p>
        <p style="font-size: 1.5rem; margin-top: 10px;">Score final : <span id="final-score" style="color: var(--accent)">0</span></p>
        <button class="btn-restart" onclick="startGame()">REESSAYER</button>
    </div>

    <div class="stats">
        <span>SCORE: <span id="score" style="color: var(--accent)">0</span></span>
        <span>TEMPS: <span id="timer-text">15s</span></span>
    </div>

    <div class="timer-bar">
        <div id="progress"></div>
    </div>

    <div id="quiz-box">
        <div class="question-text" id="q-text">Chargement de la question...</div>
        <div class="options-grid" id="options">
            </div>
    </div>
</div>

<footer>
    Développé par <span class="dev-name">William / Fouda Enama Marie Fernande</span><br>
    © Copyright 2026 - École des Postes - All Rights Reserved
</footer>

<script>
    // --- MOTEUR DE QUESTIONS (Encyclopédie simulée par niveaux) ---
    // En production, on pourrait fetcher une API, ici on crée un générateur logique.
    const questionsPool = [
        { q: "Quelle est la capitale économique du Cameroun ?", a: ["Douala", "Yaoundé", "Garoua", "Bafoussam"], c: 0, d: 1 },
        { q: "Quel est l'indicatif téléphonique du Cameroun ?", a: ["+234", "+237", "+221", "+241"], c: 1, d: 1 },
        { q: "En quelle année le Cameroun a-t-1 obtenu son indépendance ?", a: ["1958", "1960", "1961", "1972"], c: 1, d: 2 },
        { q: "Quel lion indomptable détient le record de buts en CAN ?", a: ["Roger Milla", "Samuel Eto'o", "Patrick Mboma", "Vincent Aboubakar"], c: 1, d: 2 },
        { q: "Quel est le plus haut sommet du Cameroun ?", a: ["Mont Mandara", "Mont Cameroun", "Mont Manengouba", "Mont Oku"], c: 1, d: 2 },
        { q: "Qui a écrit 'Le Vieux Nègre et la Médaille' ?", a: ["Mongo Beti", "Ferdinand Oyono", "Léopold Senghor", "Calixthe Beyala"], c: 1, d: 3 },
        { q: "Quelle est la langue officielle la plus parlée à l'Est ?", a: ["Français", "Anglais", "Ewondo", "Fufuldé"], c: 0, d: 3 }
    ];

    let score = 0;
    let currentQuestion = {};
    let timer;
    let timeLeft = 15;
    let gameActive = false;

    function startGame() {
        score = 0;
        gameActive = true;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('score').innerText = score;
        nextQuestion();
    }

    function nextQuestion() {
        if(!gameActive) return;
        
        // Sélection intelligente par difficulté
        let diff = score < 5 ? 1 : (score < 12 ? 2 : 3);
        document.getElementById('difficulty-label').innerText = diff === 1 ? "NOVICE" : (diff === 2 ? "CHAMPION" : "LÉGENDE");
        
        const filtered = questionsPool.filter(q => q.d === diff);
        currentQuestion = filtered[Math.floor(Math.random() * filtered.length)];
        
        displayQuestion();
        startTimer();
    }

    function displayQuestion() {
        document.getElementById('q-text').innerText = currentQuestion.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        currentQuestion.a.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 15;
        const bar = document.getElementById('progress');
        const text = document.getElementById('timer-text');
        
        timer = setInterval(() => {
            timeLeft -= 0.1;
            const percent = (timeLeft / 15) * 100;
            bar.style.width = percent + "%";
            text.innerText = Math.ceil(timeLeft) + "s";
            
            if(timeLeft <= 0) {
                endGame("Temps écoulé !");
            }
        }, 100);
    }

    function checkAnswer(idx) {
        if(idx === currentQuestion.c) {
            score++;
            document.getElementById('score').innerText = score;
            nextQuestion();
        } else {
            endGame("Mauvaise réponse !");
        }
    }

    function endGame(reason) {
        gameActive = false;
        clearInterval(timer);
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('end-reason').innerText = reason;
        document.getElementById('final-score').innerText = score;
        document.getElementById('end-title').innerText = "GAME OVER";
    }

    // Lancement au chargement
    window.onload = startGame;
</script>

</body>
</html>

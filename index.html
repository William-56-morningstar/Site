<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ MASTER ULTIMATE - By William Aloys</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --text: #FFFFFF; --accent: #FFD700;
            --danger: #FF003C; --success: #00FF41; --card: #0F0F0F;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER BANGER --- */
        header { text-align: center; padding: 40px 20px; border-bottom: 5px solid var(--text); background: var(--accent); color: #000; }
        h1 { font-family: 'Anton', sans-serif; font-size: clamp(3rem, 10vw, 5rem); text-transform: uppercase; line-height: 0.8; }

        .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .game-card {
            width: 100%; max-width: 800px; background: var(--card);
            border: 4px solid var(--text); border-radius: 0px; /* Style Brutaliste */
            padding: 30px; position: relative;
            box-shadow: 20px 20px 0px var(--accent);
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { border: 2px solid var(--text); padding: 10px; font-weight: 800; text-transform: uppercase; text-align: center; }

        .timer-track { width: 100%; height: 20px; background: #222; border: 3px solid var(--text); margin-bottom: 30px; position: relative; }
        #timer-bar { height: 100%; background: var(--danger); width: 100%; transition: width 0.1s linear; }

        .cat-tag { display: inline-block; background: var(--text); color: #000; padding: 5px 15px; font-weight: 900; margin-bottom: 15px; font-size: 0.9rem; }

        .question-text { font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 700; line-height: 1.1; margin-bottom: 30px; }

        .options-stack { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .opt-btn {
            background: transparent; border: 3px solid var(--text); color: var(--text);
            padding: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem;
            font-weight: 700; cursor: pointer; text-align: left; transition: 0.1s;
        }
        .opt-btn:hover { background: var(--accent); color: #000; transform: translate(-5px, -5px); box-shadow: 5px 5px 0px var(--text); }

        /* --- OVERLAYS --- */
        #screen-overlay {
            position: absolute; inset: -4px; background: var(--bg);
            z-index: 100; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 40px;
            border: 4px solid var(--danger);
        }
        .btn-restart { 
            background: var(--success); color: #000; border: 4px solid #000;
            padding: 20px 50px; font-family: 'Anton', sans-serif; font-size: 2rem;
            cursor: pointer; margin-top: 30px; box-shadow: 8px 8px 0px #000;
        }

        footer { background: #000; color: #fff; padding: 30px; text-align: center; border-top: 4px solid var(--text); }
        .dev-credit { font-family: 'Anton', sans-serif; font-size: 1.5rem; color: var(--accent); }

        /* Animation Error */
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<header>
    <h1>QUIZ MASTER</h1>
</header>

<div class="main-container">
    <div class="game-card" id="game-card">
        <div id="screen-overlay">
            <h2 id="res-title" style="font-family: 'Anton'; font-size: 4rem;">MORT !</h2>
            <p id="res-msg" style="font-size: 1.5rem; margin: 10px 0;">Tu as échoué comme un bleu.</p>
            <div style="font-size: 3rem; font-weight: 900;" id="final-score">0</div>
            <button class="btn-restart" onclick="initGame()">RENAÎTRE</button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">SCORE: <span id="score" style="color: var(--accent)">0</span></div>
            <div class="stat-item">TIME: <span id="time-text">15s</span></div>
        </div>

        <div class="timer-track"><div id="timer-bar"></div></div>

        <div id="cat-label" class="cat-tag">CHARGEMENT...</div>
        <div class="question-text" id="q-text">Préparez-vous...</div>

        <div class="options-stack" id="options"></div>
    </div>
</div>

<footer>
    DÉVELOPPÉ PAR <span class="dev-credit">WILLIAM ALOYS</span><br>
    <small>© 2026 - ECOLE DES POSTES - TOUS DROITS RÉSERVÉS</small>
</footer>

<script>
    // --- MÉGA BASE DE DONNÉES ENCYCLOPÉDIQUE ---
    const database = [
        { c: "HISTOIRE", q: "Qui était le chef de la résistance camerounaise contre les colons ?", a: ["Um Nyobé", "Ahidjo", "Biya", "Milla"], r: 0 },
        { c: "SCIENCE", q: "Quelle est la vitesse de la lumière (environ) ?", a: ["300 000 km/s", "150 000 km/s", "1 000 000 km/s", "500 km/h"], r: 0 },
        { c: "RELIGION", q: "Quel est le premier livre de la Bible ?", a: ["Exode", "Genèse", "Jean", "Psaumes"], r: 1 },
        { c: "MATHS", q: "Quelle est la valeur approchée de Pi ?", a: ["3.12", "3.16", "3.14", "3.18"], r: 2 },
        { c: "GEO", q: "Dans quelle ville se trouve le monument de la Réunification ?", a: ["Douala", "Garoua", "Yaoundé", "Bafoussam"], r: 2 },
        { c: "SOCIÉTÉ", q: "Quelle est la monnaie de l'Afrique de l'Ouest ?", a: ["Euro", "Dollar", "Franc CFA", "Naira"], r: 2 },
        { c: "SCIENCE", q: "Combien d'éléments compte le tableau périodique ?", a: ["100", "118", "92", "124"], r: 1 },
        { c: "HISTOIRE", q: "Qui a découvert l'Amérique ?", a: ["Magellan", "Vasco de Gama", "Christophe Colomb", "Marco Polo"], r: 2 },
        { c: "CULTURE", q: "Quel pays a inventé le Reggae ?", a: ["Nigeria", "USA", "Jamaïque", "Brésil"], r: 2 },
        { c: "MATHS", q: "Comment appelle-t-on un angle de 90 degrés ?", a: ["Aigu", "Obtus", "Droit", "Plat"], r: 2 },
        { c: "RELIGION", q: "Quel est le mois de jeûne sacré chez les musulmans ?", a: ["Noël", "Ramadan", "Pâques", "Aïd"], r: 1 },
        { c: "SPORT", q: "Qui est le meilleur buteur de l'histoire de la sélection du Cameroun ?", a: ["Eto'o", "Milla", "Mboma", "Aboubakar"], r: 0 },
        { c: "SCIENCE", q: "Quel gaz est nécessaire à la respiration humaine ?", a: ["Azote", "Hélium", "Oxygène", "CO2"], r: 2 },
        { c: "GÉO", q: "Quel est le plus petit pays du monde ?", a: ["Monaco", "Vatican", "Malte", "Andorre"], r: 1 },
        { c: "CULTURE", q: "Quelle est la capitale du Japon ?", a: ["Séoul", "Pékin", "Kyoto", "Tokyo"], r: 3 }
        // Ajoute ici autant de questions que tu veux !
    ];

    let deck = [];
    let score = 0;
    let current;
    let timer;
    let timeRemaining;

    function initGame() {
        score = 0;
        deck = [...database];
        shuffle(deck);
        document.getElementById('screen-overlay').style.display = 'none';
        document.getElementById('score').innerText = score;
        document.getElementById('game-card').classList.remove('shake');
        spawnQuestion();
    }

    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
    }

    function spawnQuestion() {
        if (deck.length === 0) {
            victory();
            return;
        }

        current = deck.pop(); // Retire la question : ZÉRO RÉPÉTITION
        document.getElementById('cat-label').innerText = current.c;
        document.getElementById('q-text').innerText = current.q;
        
        const container = document.getElementById('options');
        container.innerHTML = '';

        current.a.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = txt;
            b.onclick = () => verify(i);
            container.appendChild(b);
        });

        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timeRemaining = 15;
        const bar = document.getElementById('timer-bar');
        const txt = document.getElementById('time-text');

        timer = setInterval(() => {
            timeRemaining -= 0.1;
            bar.style.width = (timeRemaining / 15) * 100 + "%";
            txt.innerText = Math.ceil(timeRemaining) + "s";

            if (timeRemaining <= 0) {
                gameOver("TEMPS ÉCOULÉ !");
            }
        }, 100);
    }

    function verify(idx) {
        if (idx === current.r) {
            score++;
            document.getElementById('score').innerText = score;
            spawnQuestion();
        } else {
            gameOver("MAUVAISE RÉPONSE !");
        }
    }

    function gameOver(reason) {
        clearInterval(timer);
        const card = document.getElementById('game-card');
        card.classList.add('shake');
        
        setTimeout(() => {
            document.getElementById('screen-overlay').style.display = 'flex';
            document.getElementById('res-title').innerText = "GAME OVER";
            document.getElementById('res-msg').innerText = reason;
            document.getElementById('final-score').innerText = score;
        }, 400);
    }

    function victory() {
        clearInterval(timer);
        document.getElementById('screen-overlay').style.display = 'flex';
        document.getElementById('res-title').innerText = "LÉGENDE !";
        document.getElementById('res-msg').innerText = "Tu as fini toute l'encyclopédie.";
        document.getElementById('final-score').innerText = score;
        document.getElementById('res-title').style.color = "var(--success)";
    }

    window.onload = initGame;
</script>

</body>
</html>
